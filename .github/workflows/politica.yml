name: Fetch politica news
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8-20 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-politica-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Check out repo
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 1
    - name: Download Feed
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 8 --max-time 15 "https://www.publico.pt/api/search/?size=20&tags=politica" |
          jq -cs 'if length == 1 and (.[0] | (type == "object" or type == "array")) then .[0] else error("Invalid feed: politica.json") end' > "$RUNNER_TEMP/politica.json"
    - name: Commit and push changes
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "Automated"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for attempt in 1 2 3; do
          if timeout 15s git fetch --no-tags --depth=1 origin refs/heads/main; then
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/politica.json" "politica.json"
            git add -- politica.json
            if git diff --cached --quiet; then
              echo "No changes to publish."
              exit 0
            fi
            git commit -m "Updated politica news"
            if timeout 15s git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          fi
          echo "::warning::Publish attempt $attempt failed."
          if [ "$attempt" -lt 3 ]; then
            sleep 2
          fi
        done
        echo "Unable to publish after three attempts." >&2
        exit 1
